                    return [...prev, { ...item, qty: quantity }];
                });

                        const newQty = item.qty + delta;
                        return newQty > 0 ? { ...item, qty: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));

                setCart(prev => prev.filter(i => i.id !== id));
            };

                                        <img 
                                            src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1000&q=80" 
                                            alt="Sage Cafe Atmosphere" 
                                            className="w-full h-full object-cover"
                                        />
                                    </div>
                                    <div className="absolute top-6 left-6 bg-[#121316]/90 backdrop-blur-md border border-[#D4AF37]/50 p-4 rounded-xl shadow-lg">
                                        <p className="font-serif text-lg font-bold text-white">🔥 Artisanal Flame</p>
                                        <p className="text-xs text-gray-400">Mastered Charbroiling</p>
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    <span className="text-xs uppercase tracking-[0.3em] text-[#C5A059] font-medium block">
                                        Culinary Heritage
                                    </span>
                                    <h2 className="font-serif text-3xl sm:text-5xl font-normal text-white leading-tight">
                                        Crafting Culinary Artistry in the Heart of Lahore
                                    </h2>
                                    <p className="text-gray-300 leading-relaxed font-light text-base">
                                        SAGE CAFE & GRILL brings a sophisticated dining vision to Kasuri Road, Gulberg III. Our kitchen brings together carefully sourced cut steaks, velvety handcrafted pastas, rich parmesan creations, and vibrant Asian specialties.
                                    </p>
                                    <p className="text-gray-400 leading-relaxed font-light text-sm">
                                        Whether you are seeking a relaxed lunch with colleagues, an intimate evening with loved ones, or an indulging platter of signature dynamite shrimps, every dish is prepared with meticulous detail and served with authentic Pakistani warmth.
                                    </p>
                                    <a 
                                        href="#menu" 
                                        className="inline-flex items-center gap-2 text-xs uppercase tracking-widest text-[#D4AF37] hover:text-white font-semibold transition-colors mt-4"
                                    >
                                        <span>Explore Full Menu Selection</span> ↗
                                    </a>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Signature Section */}
                    <section id="signatures" className="py-20 bg-[#121316]">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center max-w-3xl mx-auto mb-16">
                                <span className="text-xs uppercase tracking-[0.3em] text-[#C5A059] font-medium block mb-3">
                                    House Specialties
                                </span>
                                <h2 className="font-serif text-3xl sm:text-5xl font-normal text-white">
                                    Signature Dishes
                                </h2>
                                <p className="text-gray-400 text-sm mt-4 font-light">
                                    Carefully curated culinary highlights favored by guest connoisseurs in Gulberg III.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {MENU_ITEMS.filter(item => item.isSignature).map(item => (
                                    <div 
                                        key={item.id}
                                        className="bg-[#1a1c23] rounded-2xl overflow-hidden border border-white/10 hover:border-[#D4AF37]/50 transition-all flex flex-col justify-between shadow-xl"
                                    >
                                        <div>
                                            <div className="relative aspect-[4/3] overflow-hidden">
                                                <img 
                                                    src={item.image} 
                                                    alt={item.name} 
                                                    className="w-full h-full object-cover hover:scale-105 transition-transform duration-500"
                                                />
                                                <div className="absolute top-4 left-4 flex flex-wrap gap-1.5">
                                                    {item.tags.map((tag, idx) => (
                                                        <span key={idx} className="bg-black/60 backdrop-blur-md text-[#D4AF37] text-[10px] uppercase font-semibold px-2.5 py-1 rounded-full">
                                                            {tag}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="p-6">
                                                <h3 className="font-serif text-xl text-white mb-2">{item.name}</h3>
                                                <p className="text-xs text-gray-400 font-light leading-relaxed mb-4">{item.description}</p>
                                            </div>
                                        </div>

                                        <div className="px-6 pb-6 pt-0 flex items-center justify-between border-t border-white/5 mt-auto">
                                            <span className="font-serif text-lg font-bold text-[#D4AF37]">Rs. {item.price.toLocaleString()}</span>
                                            <button 
                                                onClick={() => addToCart(item)}
                                                className="px-4 py-2 bg-white/10 hover:bg-[#D4AF37] hover:text-black text-white text-xs font-semibold uppercase rounded-full transition-all"
                                            >
                                                + Quick Add
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {}
                    {/* Digital Menu Section */}
                    <section id="menu" className="py-24 bg-[#181a20] border-t border-white/5">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center max-w-3xl mx-auto mb-12">
                                <span className="text-xs uppercase tracking-[0.3em] text-[#C5A059] font-medium block mb-3">
                                    Explore Selections
                                </span>
                                <h2 className="font-serif text-3xl sm:text-5xl font-normal text-white">
                                    Digital Dining Menu
                                </h2>
                            </div>

                            {/* Category Filters */}
                            <div className="flex items-center gap-2 overflow-x-auto pb-4 mb-10 no-scrollbar justify-start lg:justify-center border-b border-white/10">
                                {MENU_CATEGORIES.map(category => (
                                    <button
                                        key={category}
                                        onClick={() => {
                                            setActiveCategory(category);
                                            setSearchQuery("");
                                        }}
                                        className={`whitespace-nowrap px-5 py-2.5 rounded-full text-xs uppercase tracking-wider font-medium transition-all ${
                                            activeCategory === category && searchQuery === ""
                                                ? "bg-[#D4AF37] text-black font-bold"
                                                : "bg-white/5 text-gray-400 hover:text-white border border-white/5"
                                        }`}
                                    >
                                        {category}
                                    </button>
                                ))}
                            </div>

                            {/* Menu Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredMenuItems.map(item => (
                                    <div key={item.id} className="bg-[#121316] rounded-xl border border-white/10 p-4 flex flex-col justify-between">
                                        <div>
                                            <div className="relative aspect-[16/10] rounded-lg overflow-hidden mb-4">
                                                <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                                            </div>
                                            <h3 className="font-serif text-lg text-white font-medium mb-1">{item.name}</h3>
                                            <p className="text-xs text-gray-400 font-light leading-relaxed mb-4">{item.description}</p>
                                        </div>

                                        <div className="pt-3 border-t border-white/5 flex items-center justify-between">
                                            <span className="text-xs font-bold text-[#D4AF37]">Rs. {item.price.toLocaleString()}</span>
                                            <button
                                                onClick={() => addToCart(item)}
                                                className="px-3.5 py-1.5 bg-[#D4AF37] hover:bg-[#C5A059] text-black text-xs font-bold uppercase rounded-full"
                                            >
                                                + Add
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {}
                    {/* Gallery */}
                    <section id="gallery" className="py-24 bg-[#121316]">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center max-w-3xl mx-auto mb-16">
                                <span className="text-xs uppercase tracking-[0.3em] text-[#C5A059] font-medium block mb-3">
                                    Visual Journey
                                </span>
                                <h2 className="font-serif text-3xl sm:text-5xl font-normal text-white">
                                    Restaurant Ambience & Gallery
                                </h2>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {GALLERY_IMAGES.map((img, index) => (
                                    <div 
                                        key={index}
                                        onClick={() => setLightboxIndex(index)}
                                        className="group relative aspect-[4/3] rounded-2xl overflow-hidden cursor-pointer border border-white/10"
                                    >
                                        <img src={img.url} alt={img.title} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-6 flex flex-col justify-end">
                                            <span className="text-[10px] text-[#D4AF37] uppercase">{img.sub}</span>
                                            <p className="font-serif text-lg text-white">{img.title}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Location & Contact Section */}
                    <section id="contact" className="py-24 bg-[#1a1c23] border-t border-white/5">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                                <div className="space-y-6">
                                    <span className="text-xs uppercase tracking-[0.3em] text-[#C5A059] font-medium block">
                                        Visit Us
                                    </span>
                                    <h2 className="font-serif text-3xl sm:text-4xl font-normal text-white">
                                        Location & Hours
                                    </h2>

                                    <div className="bg-[#121316] border border-white/10 p-6 rounded-2xl space-y-2">
                                        <h3 className="font-serif text-lg text-white">Address</h3>
                                        <p className="text-xs text-gray-300">{RESTAURANT_CONFIG.address}</p>
                                        <a href={RESTAURANT_CONFIG.googleMapsUrl} target="_blank" rel="noopener noreferrer" className="text-xs text-[#D4AF37] underline inline-block mt-2">
                                            Open Google Maps ↗
                                        </a>
                                    </div>

                                    <div className="bg-[#121316] border border-white/10 p-6 rounded-2xl space-y-2">
                                        <h3 className="font-serif text-lg text-white">Phone Enquiries</h3>
                                        <a href={`tel:${RESTAURANT_CONFIG.phoneRaw}`} className="text-base font-bold text-[#D4AF37]">
                                            {RESTAURANT_CONFIG.phone}
                                        </a>
                                    </div>
                                </div>

                                {/* Contact Form */}
                                <div className="bg-[#121316] border border-white/10 p-8 rounded-2xl">
                                    <h3 className="font-serif text-2xl text-white mb-4">Send an Enquiry</h3>
                                    <form onSubmit={(e) => { e.preventDefault(); showToast("Enquiry submitted!"); e.target.reset(); }} className="space-y-4">
                                        <input type="text" required placeholder="Full Name" className="w-full bg-[#1a1c23] border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#D4AF37]" />
                                        <input type="tel" required placeholder="Mobile Number" className="w-full bg-[#1a1c23] border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#D4AF37]" />
                                        <textarea rows={3} required placeholder="Your message..." className="w-full bg-[#1a1c23] border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#D4AF37]"></textarea>
                                        <button type="submit" className="w-full py-3.5 bg-[#D4AF37] text-black font-bold uppercase text-xs rounded-xl">Submit Enquiry</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </section>

                    {}
                    {/* Footer */}
                    <footer className="bg-[#0b0c0e] border-t border-white/10 text-gray-400 py-12 text-center text-xs">
                        <div className="max-w-7xl mx-auto px-4 space-y-4">
                            <span className="font-serif text-2xl font-bold tracking-widest text-white block">SAGE CAFE & GRILL</span>
                            <p>© {new Date().getFullYear()} SAGE CAFE & GRILL, Gulberg III, Lahore, Pakistan.</p>
                            <p className="text-[#C5A059]">{RESTAURANT_CONFIG.demoNotice}</p>
                        </div>
                    </footer>

                    {/* Cart Drawer */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 flex justify-end bg-black/70 backdrop-blur-sm">
                            <div className="w-full max-w-md bg-[#121316] border-l border-white/10 h-full p-6 flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center border-b border-white/10 pb-4">
                                        <h2 className="font-serif text-xl text-white">Your Cart</h2>
                                        <button onClick={() => setIsCartOpen(false)} className="text-gray-400">✕</button>
                                    </div>

                                    <div className="mt-4 space-y-3 max-h-[50vh] overflow-y-auto">
                                        {cart.map(item => (
                                            <div key={item.id} className="flex justify-between items-center bg-[#1a1c23] p-3 rounded-xl border border-white/5">
                                                <div>
                                                    <p className="text-sm font-medium text-white">{item.name}</p>
                                                    <p className="text-xs text-[#D4AF37]">Rs. {item.price}</p>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => updateQty(item.id, -1)} className="px-2 bg-white/10 rounded">-</button>
                                                    <span className="text-xs">{item.qty}</span>
                                                    <button onClick={() => updateQty(item.id, 1)} className="px-2 bg-white/10 rounded">+</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {cart.length > 0 && (
                                    <div className="border-t border-white/10 pt-4 space-y-2">
                                        <div className="flex justify-between text-xs">
                                            <span>Total</span>
                                            <span className="text-[#D4AF37] font-bold">Rs. {cartGrandTotal.toLocaleString()}</span>
                                        </div>
                                        <button onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }} className="w-full py-3 bg-[#D4AF37] text-black font-bold uppercase text-xs rounded-xl">
                                            Proceed to Checkout
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Checkout Modal */}
                    {isCheckoutOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-[#1a1c23] border border-white/10 rounded-2xl max-w-md w-full p-6 relative">
                                <button onClick={() => setIsCheckoutOpen(false)} className="absolute top-4 right-4 text-gray-400">✕</button>
                                <h3 className="font-serif text-2xl text-white mb-4">Checkout Order</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const msg = `Order request for ${e.target.name.value} (${e.target.phone.value}) - Total Rs. ${cartGrandTotal}`;
                                    window.open(`https://wa.me/${RESTAURANT_CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
                                    clearCart();
                                    setIsCheckoutOpen(false);
                                }} className="space-y-4">
                                    <input name="name" type="text" required placeholder="Full Name" className="w-full bg-[#121316] border border-white/15 rounded-xl px-4 py-3 text-sm text-white" />
                                    <input name="phone" type="tel" required placeholder="Phone Number" className="w-full bg-[#121316] border border-white/15 rounded-xl px-4 py-3 text-sm text-white" />
                                    <button type="submit" className="w-full py-3.5 bg-emerald-600 text-white font-bold text-xs uppercase rounded-xl">
                                        Send Order via WhatsApp
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Reservation Modal */}
                    {isReservationOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-[#1a1c23] border border-white/10 rounded-2xl max-w-md w-full p-6 relative">
                                <button onClick={() => setIsReservationOpen(false)} className="absolute top-4 right-4 text-gray-400">✕</button>
                                <h3 className="font-serif text-2xl text-white mb-4">Table Reservation</h3>
                                <form onSubmit={(e) => { e.preventDefault(); setIsReservationOpen(false); showToast("Reservation Submitted!"); }} className="space-y-4">
                                    <input type="text" required placeholder="Guest Name" className="w-full bg-[#121316] border border-white/15 rounded-xl px-4 py-3 text-sm text-white" />
                                    <input type="date" required className="w-full bg-[#121316] border border-white/15 rounded-xl px-4 py-3 text-sm text-white" />
                                    <button type="submit" className="w-full py-3.5 bg-[#D4AF37] text-black font-bold uppercase text-xs rounded-xl">Confirm Reservation</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Gallery Lightbox */}
                    {lightboxIndex !== null && (
                        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                            <button onClick={() => setLightboxIndex(null)} className="absolute top-6 right-6 text-white text-2xl">✕</button>
                            <img src={GALLERY_IMAGES[lightboxIndex].url} alt="Lightbox Preview" className="max-h-[80vh] rounded-lg object-contain" />
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-[#D4AF37] text-black font-bold px-5 py-3 rounded-xl shadow-2xl text-xs uppercase">
                            ✓ {toastMessage}
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
